version: '3.8'
services:
  app:
    build: .
    command: npm run start --prefix backend
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/dev.db
      - JWT_SECRET
      - ENCRYPTION_KEY
    depends_on: []
