services:
  - type: web
    name: ai-crypto-trading
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    buildCommand: npm run build
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        fromDatabase: false
        value: ""
      - key: ENCRYPTION_KEY
        fromDatabase: false
        value: ""
      - key: DATABASE_URL
        fromDatabase: false
        value: "file:./data/dev.db"
    autoDeploy: true
