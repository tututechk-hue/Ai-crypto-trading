# Render configuration updated for multi-service single container
services:
  - type: web
    name: ai-crypto-trading
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    buildCommand: npm run build --prefix backend && npm run build --prefix frontend
    envVars:
      - key: JWT_SECRET
        value: ""
      - key: ENCRYPTION_KEY
        value: ""
      - key: DATABASE_URL
        value: "file:./data/dev.db"
    autoDeploy: true
